<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Closet Student</title>
    <!-- React, ReactDOM e Babel via CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #f8fafc;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            // Categorias de roupas
            const CATEGORIES = ["Todas", "Partes de Cima", "Partes de Baixo", "Calçados", "Acessórios", "Casacos"];

            // Estado inicial com alguns itens de exemplo
            const [items, setItems] = useState(() => {
                const saved = localStorage.getItem('closet_items');
                if (saved) {
                    try { return JSON.parse(saved); } catch (e) { console.error(e); }
                }
                return [
                    { id: 1, name: "Camiseta Branca Básica", category: "Partes de Cima", color: "#FFFFFF", favorite: true, image: "https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=300" },
                    { id: 2, name: "Calça Jeans Oversized", category: "Partes de Baixo", color: "#2563EB", favorite: false, image: "https://images.unsplash.com/photo-1541099649105-f69ad21f3246?w=300" },
                    { id: 3, name: "Tênis Branco Classic", category: "Calçados", color: "#F3F4F6", favorite: true, image: "https://images.unsplash.com/photo-1549298916-b41d501d3772?w=300" },
                    { id: 4, name: "Moletom Cinza Escolar", category: "Casacos", color: "#9CA3AF", favorite: false, image: "https://images.unsplash.com/photo-1556905055-8f358a7a47b2?w=300" }
                ];
            });

            const [selectedCategory, setSelectedCategory] = useState("Todas");
            const [searchTerm, setSearchTerm] = useState("");
            const [showModal, setShowModal] = useState(false);
            const [newItem, setNewItem] = useState({ name: "", category: "Partes de Cima", color: "#000000", image: "" });
            const [activeTab, setActiveTab] = useState("closet"); // 'closet' ou 'outfits'
            const [generatedOutfit, setGeneratedOutfit] = useState(null);

            // Salvar no LocalStorage sempre que alterar os itens
            useEffect(() => {
                localStorage.setItem('closet_items', JSON.stringify(items));
            }, [items]);

            // Adicionar item
            const handleAddItem = (e) => {
                e.preventDefault();
                if (!newItem.name) return;
                
                const item = {
                    id: Date.now(),
                    name: newItem.name,
                    category: newItem.category,
                    color: newItem.color,
                    favorite: false,
                    image: newItem.image || "https://images.unsplash.com/photo-1489987707025-afc232f7ea0f?w=300"
                };

                setItems([item, ...items]);
                setNewItem({ name: "", category: "Partes de Cima", color: "#000000", image: "" });
                setShowModal(false);
            };

            // Alternar favorito
            const toggleFavorite = (id) => {
                setItems(items.map(item => item.id === id ? { ...item, favorite: !item.favorite } : item));
            };

            // Deletar item
            const deleteItem = (id) => {
                setItems(items.filter(item => item.id !== id));
            };

            // Gerar Outfit Aleatório
            const generateRandomOutfit = () => {
                const tops = items.filter(i => i.category === "Partes de Cima" || i.category === "Casacos");
                const bottoms = items.filter(i => i.category === "Partes de Baixo");
                const shoes = items.filter(i => i.category === "Calçados");

                if (tops.length === 0 || bottoms.length === 0) {
                    alert("Adicione pelo menos uma parte de cima e uma de baixo para gerar um look!");
                    return;
                }

                const randomTop = tops[Math.floor(Math.random() * tops.length)];
                const randomBottom = bottoms[Math.floor(Math.random() * bottoms.length)];
                const randomShoe = shoes.length > 0 ? shoes[Math.floor(Math.random() * shoes.length)] : null;

                setGeneratedOutfit({
                    top: randomTop,
                    bottom: randomBottom,
                    shoe: randomShoe
                });
            };

            // Itens filtrados
            const filteredItems = items.filter(item => {
                const matchesCategory = selectedCategory === "Todas" || item.category === selectedCategory;
                const matchesSearch = item.name.toLowerCase().includes(searchTerm.toLowerCase());
                return matchesCategory && matchesSearch;
            });

            return (
                <div className="min-h-screen bg-slate-50 flex flex-col md:flex-row">
                    {/* Sidebar / Menu */}
                    <aside className="w-full md:w-64 bg-indigo-900 text-white p-6 flex flex-col justify-between">
                        <div>
                            <div className="flex items-center space-x-3 mb-8">
                                <i className="fa-solid fa-shirt text-2xl text-indigo-400"></i>
                                <h1 className="text-xl font-bold tracking-wide">Meu Closet</h1>
                            </div>

                            <nav className="space-y-2">
                                <button 
                                    onClick={() => setActiveTab("closet")} 
                                    className={`w-full flex items-center space-x-3 px-4 py-3 rounded-lg text-left transition ${activeTab === 'closet' ? 'bg-indigo-800 text-white' : 'text-indigo-200 hover:bg-indigo-800/50'}`}
                                >
                                    <i className="fa-solid fa-layer-group"></i>
                                    <span>Meu Armário</span>
                                </button>
                                <button 
                                    onClick={() => setActiveTab("outfits")} 
                                    className={`w-full flex items-center space-x-3 px-4 py-3 rounded-lg text-left transition ${activeTab === 'outfits' ? 'bg-indigo-800 text-white' : 'text-indigo-200 hover:bg-indigo-800/50'}`}
                                >
                                    <i className="fa-solid fa-wand-magic-sparkles"></i>
                                    <span>Gerador de Looks</span>
                                </button>
                            </nav>
                        </div>

                        <div className="pt-6 border-t border-indigo-800">
                            <p className="text-xs text-indigo-300">Estudante Organizado &copy; 2026</p>
                        </div>
                    </aside>

                    {/* Conteúdo Principal */}
                    <main className="flex-1 p-6 md:p-10 max-w-7xl mx-auto">
                        {activeTab === "closet" ? (
                            <>
                                {/* Header do Closet */}
                                <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
                                    <div>
                                        <h2 className="text-2xl font-bold text-slate-800">Suas Peças</h2>
                                        <p className="text-slate-500 text-sm">Gerencie todas as roupas do seu guarda-roupa</p>
                                    </div>
                                    <button 
                                        onClick={() => setShowModal(true)} 
                                        className="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-lg font-medium flex items-center justify-center space-x-2 transition shadow-sm"
                                    >
                                        <i className="fa-solid fa-plus"></i>
                                        <span>Adicionar Peça</span>
                                    </button>
                                </div>

                                {/* Filtros e Busca */}
                                <div className="flex flex-col md:flex-row gap-4 mb-6">
                                    <div className="relative flex-1">
                                        <i className="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-slate-400"></i>
                                        <input 
                                            type="text" 
                                            placeholder="Buscar peça por nome..." 
                                            value={searchTerm}
                                            onChange={(e) => setSearchTerm(e.target.value)}
                                            className="w-full pl-10 pr-4 py-2.5 bg-white border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                        />
                                    </div>
                                    <div className="flex gap-2 overflow-x-auto pb-2 custom-scrollbar">
                                        {CATEGORIES.map(cat => (
                                            <button
                                                key={cat}
                                                onClick={() => setSelectedCategory(cat)}
                                                className={`px-4 py-2 rounded-lg text-sm font-medium whitespace-nowrap transition ${selectedCategory === cat ? 'bg-indigo-600 text-white' : 'bg-white border border-slate-200 text-slate-600 hover:bg-slate-50'}`}
                                            >
                                                {cat}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {/* Grid de Roupas */}
                                {filteredItems.length === 0 ? (
                                    <div className="text-center py-16 bg-white rounded-xl border border-slate-200">
                                        <i className="fa-solid fa-box-open text-4xl text-slate-300 mb-3"></i>
                                        <p className="text-slate-500 font-medium">Nenhuma peça encontrada.</p>
                                    </div>
                                ) : (
                                    <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                                        {filteredItems.map(item => (
                                            <div key={item.id} className="bg-white rounded-xl border border-slate-200 overflow-hidden group hover:shadow-md transition">
                                                <div className="relative h-48 bg-slate-100 overflow-hidden">
                                                    <img src={item.image} alt={item.name} className="w-full h-full object-cover group-hover:scale-105 transition duration-300" />
                                                    <button 
                                                        onClick={() => toggleFavorite(item.id)}
                                                        className="absolute top-3 right-3 p-2 rounded-full bg-white/80 backdrop-blur-sm text-slate-600 hover:text-red-500 transition"
                                                    >
                                                        <i className={`${item.favorite ? 'fa-solid text-red-500' : 'fa-regular'} fa-heart`}></i>
                                                    </button>
                                                    <span className="absolute bottom-3 left-3 bg-slate-900/70 text-white text-xs px-2.5 py-1 rounded-full backdrop-blur-sm">
                                                        {item.category}
                                                    </span>
                                                </div>
                                                <div className="p-4 flex justify-between items-center">
                                                    <div>
                                                        <h3 className="font-semibold text-slate-800 text-sm line-clamp-1">{item.name}</h3>
                                                        <div className="flex items-center space-x-2 mt-1">
                                                            <span className="w-3 h-3 rounded-full border border-slate-300" style={{ backgroundColor: item.color }}></span>
                                                        </div>
                                                    </div>
                                                    <button 
                                                        onClick={() => deleteItem(item.id)}
                                                        className="text-slate-400 hover:text-red-500 p-1 transition"
                                                    >
                                                        <i className="fa-solid fa-trash-can"></i>
                                                    </button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </>
                        ) : (
                            /* Gerador de Outfits */
                            <div className="max-w-2xl mx-auto text-center py-8">
                                <h2 className="text-2xl font-bold text-slate-800 mb-2">Gerador de Looks Diários</h2>
                                <p className="text-slate-500 mb-8">Monte uma combinação aleatória perfeita para o dia de aula!</p>

                                <button 
                                    onClick={generateRandomOutfit}
                                    className="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-xl font-medium shadow-md hover:shadow-lg transition flex items-center justify-center space-x-2 mx-auto mb-10"
                                >
                                    <i className="fa-solid fa-dice"></i>
                                    <span>Sortear Combinação</span>
                                </button>

                                {generatedOutfit && (
                                    <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                                        <h3 className="text-lg font-semibold text-slate-800 mb-6">Sua Combinação Recomendada</h3>
                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                            {generatedOutfit.top && (
                                                <div className="border border-slate-100 rounded-lg p-3 bg-slate-50">
                                                    <img src={generatedOutfit.top.image} className="w-full h-32 object-cover rounded-md mb-2" />
                                                    <p className="text-xs font-semibold text-indigo-600">PARTE DE CIMA</p>
                                                    <p className="text-sm font-medium text-slate-800 line-clamp-1">{generatedOutfit.top.name}</p>
                                                </div>
                                            )}
                                            {generatedOutfit.bottom && (
                                                <div className="border border-slate-100 rounded-lg p-3 bg-slate-50">
                                                    <img src={generatedOutfit.bottom.image} className="w-full h-32 object-cover rounded-md mb-2" />
                                                    <p className="text-xs font-semibold text-indigo-600">PARTE DE BAIXO</p>
                                                    <p className="text-sm font-medium text-slate-800 line-clamp-1">{generatedOutfit.bottom.name}</p>
                                                </div>
                                            )}
                                            {generatedOutfit.shoe && (
                                                <div className="border border-slate-100 rounded-lg p-3 bg-slate-50">
                                                    <img src={generatedOutfit.shoe.image} className="w-full h-32 object-cover rounded-md mb-2" />
                                                    <p className="text-xs font-semibold text-indigo-600">CALÇADO</p>
                                                    <p className="text-sm font-medium text-slate-800 line-clamp-1">{generatedOutfit.shoe.name}</p>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    {/* Modal Adicionar Peça */}
                    {showModal && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl">
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="text-lg font-bold text-slate-800">Nova Peça de Roupa</h3>
                                    <button onClick={() => setShowModal(false)} className="text-slate-400 hover:text-slate-600">
                                        <i className="fa-solid fa-xmark text-lg"></i>
                                    </button>
                                </div>
                                <form onSubmit={handleAddItem} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Nome da Peça</label>
                                        <input 
                                            type="text" 
                                            required
                                            placeholder="Ex: Blusa Preta Oversized" 
                                            value={newItem.name} 
                                            onChange={(e) => setNewItem({ ...newItem, name: e.target.value })}
                                            className="w-full px-3 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none" 
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Categoria</label>
                                        <select 
                                            value={newItem.category} 
                                            onChange={(e) => setNewItem({ ...newItem, category: e.target.value })}
                                            className="w-full px-3 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                                        >
                                            {CATEGORIES.filter(c => c !== "Todas").map(c => (
                                                <option key={c} value={c}>{c}</option>
                                            ))}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">URL da Imagem (opcional)</label>
                                        <input 
                                            type="url" 
                                            placeholder="https://exemplo.com/imagem.jpg" 
                                            value={newItem.image} 
                                            onChange={(e) => setNewItem({ ...newItem, image: e.target.value })}
                                            className="w-full px-3 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none" 
                                        />
                                    </div>
                                    <div className="flex justify-end space-x-3 pt-4">
                                        <button 
                                            type="button" 
                                            onClick={() => setShowModal(false)}
                                            className="px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-lg"
                                        >
                                            Cancelar
                                        </button>
                                        <button 
                                            type="submit" 
                                            className="px-4 py-2 text-sm font-medium bg-indigo-600 text-white hover:bg-indigo-700 rounded-lg"
                                        >
                                            Salvar Peça
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
